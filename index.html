<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>線上簽名</title>
<script src="config.js"></script>
<style>
  :root{
    --ink:#17212b; --muted:#5f6b78; --line:#d8dee5; --bg:#eef1f4; --card:#fff;
    --accent:#0b4f94; --accent-soft:#e6eef8; --ok:#17784a; --ok-soft:#e5f4ec; --err:#b42318; --err-soft:#fdecea;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    -webkit-text-size-adjust:100%; font-size:16px; line-height:1.55}
  .top{background:var(--accent);color:#fff;padding:18px 16px 20px}
  .top .eyebrow{font-size:13px;opacity:.85;letter-spacing:.04em}
  .top h1{margin:4px 0 0;font-size:19px;font-weight:600;line-height:1.35}
  main{max-width:560px;margin:0 auto;padding:14px 12px 40px}
  .card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.06)}
  label.field{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
  input.code{width:100%;font-size:24px;letter-spacing:.12em;padding:12px 14px;border:1.5px solid var(--line);
    border-radius:10px;outline:none;font-variant-numeric:tabular-nums}
  input.code:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  button{font:inherit;cursor:pointer;border:0;border-radius:10px}
  .primary{display:block;width:100%;margin-top:12px;padding:14px;background:var(--accent);color:#fff;font-size:17px;font-weight:600}
  .primary:disabled{background:#a9b6c4;cursor:not-allowed}
  .link{background:none;color:var(--accent);padding:4px 2px;font-size:15px}
  .msg{min-height:1.4em;margin:10px 0 0;font-size:14px}
  .msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
  .who{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .who .name{font-size:20px;font-weight:600}
  .who .sub{font-size:13px;color:var(--muted)}
  .status{border-radius:10px;padding:12px 14px;font-size:15px}
  .status.ok{background:var(--ok-soft);color:var(--ok)}
  .status.todo{background:var(--accent-soft);color:var(--accent)}
  .status img{display:block;max-width:100%;max-height:90px;margin-top:8px;background:#fff;border-radius:6px;padding:4px}
  details summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
  details summary::-webkit-details-marker{display:none}
  details summary::after{content:"收合";font-weight:400;font-size:14px;color:var(--accent)}
  details:not([open]) summary::after{content:"展開"}
  .meta{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px;color:var(--muted);margin:10px 0 6px}
  .meta b{font-weight:500;color:var(--ink)}
  ol.content{margin:8px 0 0;padding-left:1.5em}
  ol.content li{margin:6px 0}

  /* ---------- 逐字簽名 ---------- */
  .padhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:600}
  .padhead .step{font-weight:500;font-size:14px;color:var(--muted)}
  .slots{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
  .slot{position:relative;width:60px;height:60px;padding:0;border:1.5px solid var(--line);border-radius:10px;background:#fcfdfe}
  .slot canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .slot .ch{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;color:#c3ccd6;pointer-events:none}
  .slot.done .ch{display:none}
  .slot.done{border-color:#9fd3b6}
  .slot.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .padwrap{position:relative;width:min(100%,58vh,380px);aspect-ratio:1/1;margin:0 auto;
    border:1.5px dashed #9aa8b6;border-radius:12px;background:#fcfdfe;touch-action:none;overflow:hidden}
  .padwrap .grid{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(#e2e7ed,#e2e7ed) 50% 0/1px 100% no-repeat,linear-gradient(#e2e7ed,#e2e7ed) 0 50%/100% 1px no-repeat}
  .padwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
  .hint{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#a4b0bc;
    font-size:18px;letter-spacing:.1em;pointer-events:none}
  .padbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
  .padbtns button{padding:10px 4px;font-size:14px;background:#fff;border:1px solid var(--line);color:var(--ink)}
  .padbtns .next{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .padbtns button:disabled{opacity:.45;cursor:not-allowed}
  .preview{margin-top:12px;border-radius:10px;background:var(--accent-soft);padding:10px 12px}
  .preview .lb{font-size:13px;color:var(--accent)}
  .preview img{display:block;max-width:100%;max-height:80px;margin:6px auto 0;background:#fff;border-radius:6px;padding:4px 10px}

  .tip{font-size:13px;color:var(--muted);margin:8px 0 0}
  .check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:15px}
  .check input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
  .done{text-align:center;padding:28px 18px}
  .done .big{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;font-size:36px;line-height:64px;margin:0 auto 12px}
  .done h2{margin:0 0 4px;font-size:21px}
  .done p{margin:0;color:var(--muted);font-size:14px}
  .done img{max-width:100%;max-height:110px;margin:16px auto 0;display:block}
  .loading{color:var(--muted);text-align:center;padding:24px}
  .adminrow{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;text-align:center}
  .ghost{background:none;border:1px solid var(--line);color:var(--muted);padding:8px 16px;font-size:14px}
  #vLogin.admin .code{border-color:#8a5a00}
  #vLogin.admin #btnLogin{background:#8a5a00}
  .board{display:block;text-align:center;margin:18px 0 0;font-size:15px;color:var(--accent);text-decoration:none}
  [hidden]{display:none!important}
</style>
</head>
<body>
<header class="top">
  <div class="eyebrow" id="periodLabel">線上簽名</div>
  <h1 id="title">載入中…</h1>
</header>

<main>
  <section id="vLoading" class="card loading">載入中…</section>

  <section id="vLogin" class="card" hidden>
    <label class="field" for="code">請輸入您的姓名代號</label>
    <input id="code" class="code" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="8" placeholder="例：613493">
    <button id="btnLogin" class="primary">登入</button>
    <p class="msg err" id="loginMsg"></p>
    <div class="adminrow"><button class="ghost" id="btnAdminMode">🔑 管理者登入</button></div>
  </section>

  <section id="vSign" hidden>
    <div class="card who">
      <div><div class="name" id="whoName"></div><div class="sub" id="whoDept"></div></div>
      <button class="link" id="btnSwitch">不是我</button>
    </div>

    <div class="card"><div class="status" id="status"></div></div>

    <details class="card" id="contentBox" open>
      <summary>宣導事項（請詳閱）</summary>
      <div class="meta">
        <span>提出部門</span><b id="mDept"></b>
        <span>宣導者</span><b id="mPresenter"></b>
      </div>
      <ol class="content" id="content"></ol>
    </details>

    <div class="card">
      <div class="padhead"><span id="padTitle">請逐字簽名</span><span class="step" id="padStep"></span></div>
      <div class="slots" id="slots"></div>
      <div class="padwrap" id="padWrap">
        <div class="grid"></div>
        <div class="hint" id="padHint"></div>
        <canvas id="pad"></canvas>
      </div>
      <div class="padbtns">
        <button type="button" id="btnPrev">← 上一字</button>
        <button type="button" id="btnUndo">復原一筆</button>
        <button type="button" id="btnClear">清除此字</button>
        <button type="button" class="next" id="btnNext">下一字 →</button>
      </div>
      <div class="preview" id="previewBox" hidden>
        <div class="lb">合併後的簽名</div>
        <img id="preview" alt="簽名預覽">
      </div>
      <p class="tip">一格寫一個字，字寫大一點、寫在格子中間。寫錯可點上方小格回去重寫。</p>
      <label class="check"><input type="checkbox" id="ack"><span>我已閱讀並瞭解上述宣導事項</span></label>
      <button id="btnSubmit" class="primary" disabled>送出簽名</button>
      <p class="msg" id="signMsg"></p>
    </div>
  </section>

  <section id="vDone" class="card done" hidden>
    <div class="big">✓</div>
    <h2>簽名完成</h2>
    <p id="doneText"></p>
    <img id="doneImg" alt="">
    <button class="link" id="btnBack" style="margin-top:16px">返回</button>
  </section>

  <a class="board" id="boardLink" href="#" target="_top" hidden>查看全體簽名狀況 →</a>
</main>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var state = { person:null, period:null, appUrl:'' };
  var STORE_KEY = 'signapp_code';

  function store(k, v){ try{ if(v===null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){} }
  function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

  function show(view){
    ['vLoading','vLogin','vSign','vDone'].forEach(function(v){ $(v).hidden = (v !== view); });
    if(view === 'vSign') pad.resize();
    window.scrollTo(0,0);
  }

  // GitHub 版：config.js 設定 window.GAS_URL → 用 fetch 呼叫 Apps Script；Apps Script 版：用 google.script.run
  var GH = !!window.GAS_URL;
  function call(fn){
    var args = Array.prototype.slice.call(arguments, 1);
    if(GH){
      return fetch(window.GAS_URL, { method:'POST', redirect:'follow',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
        .then(function(r){ return r.json(); })
        .then(function(o){ if(!o.ok) throw o.err; return o.v; },
              function(e){ throw (e && e.message) ? '無法連線（' + e.message + '）' : String(e); });
    }
    return new Promise(function(resolve, reject){
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function(err){
        reject(err && err.message ? err.message : String(err));
      });
      r[fn].apply(r, args);
    });
  }

  function renderContent(ol, text){
    ol.innerHTML = '';
    var last = null;
    String(text || '').split(/\r?\n/).forEach(function(line){
      if(!line.trim()) return;
      if(/^\s/.test(line) && last){ last.appendChild(document.createElement('br')); last.appendChild(document.createTextNode(line.trim())); return; }
      last = document.createElement('li');
      last.textContent = line.trim().replace(/^\d+[\.、]\s*/, '');
      ol.appendChild(last);
    });
  }

  function setHeader(p){
    $('title').textContent = p ? (p.title || '線上簽名') : '線上簽名';
    $('periodLabel').textContent = p ? ('簽名期別：' + p.id) : '目前沒有開放簽名的期別';
  }

  /* ---------- 逐字簽名板 ----------
     每個字一格（正方形），座標以格寬為 1 正規化儲存；
     合併時各字使用相同比例（保留簽名者原本的字大小），
     水平方向裁掉各字左右空白後依序排列，垂直方向取所有字的聯集範圍。 */
  var pad = (function(){
    var wrap = $('padWrap'), cv = $('pad'), ctx = cv.getContext('2d');
    var LW = 0.024;      // 筆畫粗細（佔格寬比例）
    var GAP = 0.06;      // 合併時字距（佔格寬比例）
    var MIN_INK = 0.2;   // 每字最少筆畫長度（格寬倍數），避免只點一下
    var OUT_H = 200, OUT_W = 700;   // 合併圖最大尺寸（px）
    var chars = [], data = [], idx = 0, cur = null, size = 0, hgt = 0;

    function drawStroke(c, pts, k, ox, oy, mul){
      if(!pts.length) return;
      c.lineWidth = LW * k * (mul || 1); c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = '#000';
      c.beginPath();
      c.moveTo((pts[0].x-ox)*k, (pts[0].y-oy)*k);
      if(pts.length === 1) c.lineTo((pts[0].x-ox)*k+0.1, (pts[0].y-oy)*k+0.1);
      for(var i=1;i<pts.length-1;i++){
        var mx = (pts[i].x + pts[i+1].x)/2, my = (pts[i].y + pts[i+1].y)/2;
        c.quadraticCurveTo((pts[i].x-ox)*k, (pts[i].y-oy)*k, (mx-ox)*k, (my-oy)*k);
      }
      if(pts.length > 1){ var l = pts[pts.length-1]; c.lineTo((l.x-ox)*k, (l.y-oy)*k); }
      c.stroke();
    }
    function drawAll(c, strokes, k, ox, oy, mul){ strokes.forEach(function(s){ drawStroke(c, s, k, ox, oy, mul); }); }

    function inkLen(strokes){
      var L = 0;
      strokes.forEach(function(s){ for(var i=1;i<s.length;i++) L += Math.hypot(s[i].x-s[i-1].x, s[i].y-s[i-1].y); });
      return L;
    }
    function bounds(strokes){
      var b = { x0:Infinity, y0:Infinity, x1:-Infinity, y1:-Infinity };
      strokes.forEach(function(s){ s.forEach(function(p){
        if(p.x<b.x0) b.x0=p.x; if(p.y<b.y0) b.y0=p.y; if(p.x>b.x1) b.x1=p.x; if(p.y>b.y1) b.y1=p.y; }); });
      return b;
    }

    /* 上方小格（縮圖） */
    function buildSlots(){
      var box = $('slots'), dpr = window.devicePixelRatio || 1; box.innerHTML = '';
      chars.forEach(function(ch, i){
        var b = document.createElement('button'); b.type = 'button'; b.className = 'slot'; b.title = '第 ' + (i+1) + ' 字「' + ch + '」';
        var s = document.createElement('span'); s.className = 'ch'; s.textContent = ch;
        var c = document.createElement('canvas'); c.width = c.height = Math.round(60 * dpr);
        b.appendChild(s); b.appendChild(c);
        b.addEventListener('click', function(){ go(i); });
        box.appendChild(b);
      });
    }
    function refreshSlots(){
      var els = $('slots').children;
      for(var i=0;i<els.length;i++){
        var el = els[i], c = el.querySelector('canvas'), x = c.getContext('2d');
        el.className = 'slot' + (i === idx ? ' on' : '') + (data[i].length ? ' done' : '');
        x.clearRect(0, 0, c.width, c.height);
        drawAll(x, data[i], c.width, 0, 0, 1.6);
      }
    }
    function refreshUI(){
      var n = chars.length, has = n && data[idx].length > 0;
      $('padStep').textContent = n ? ('第 ' + (idx+1) + ' / ' + n + ' 字') : '';
      $('padHint').textContent = n ? ('請寫「' + chars[idx] + '」') : '';
      $('padHint').hidden = !n || has;
      $('btnPrev').disabled = idx === 0;
      $('btnUndo').disabled = $('btnClear').disabled = !has;
      $('btnNext').disabled = !has;
      $('btnNext').textContent = idx >= n-1 ? '完成 ✓' : '下一字 →';
      refreshSlots();
    }
    function updatePreview(){
      var any = data.some(function(s){ return s.length; });
      $('previewBox').hidden = !any;
      if(any) $('preview').src = toPNG();
    }
    function changed(){ refreshUI(); updatePreview(); onChange(); }

    /* 大格（書寫區） */
    function redraw(){
      if(!size) return;
      ctx.clearRect(0, 0, size, hgt);
      if(chars.length) drawAll(ctx, data[idx], size, 0, 0);
    }
    function resize(){
      var r = wrap.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      if(!r.width) return;
      size = r.width; hgt = r.height;
      cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);
      redraw();
    }
    function pos(e){ var r = cv.getBoundingClientRect(); return { x:(e.clientX - r.left) / r.width, y:(e.clientY - r.top) / r.width }; }
    cv.addEventListener('pointerdown', function(e){
      if(!chars.length) return;
      e.preventDefault(); cv.setPointerCapture(e.pointerId);
      cur = [pos(e)]; data[idx].push(cur); $('padHint').hidden = true; redraw();
    });
    cv.addEventListener('pointermove', function(e){
      if(!cur) return; e.preventDefault();
      var evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      evs.forEach(function(ev){ cur.push(pos(ev)); });
      redraw();
    });
    function end(){ if(!cur) return; cur = null; changed(); }
    cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
    window.addEventListener('resize', function(){ setTimeout(resize, 120); });

    function go(i){
      if(i < 0 || i >= chars.length) return;
      idx = i; cur = null; redraw(); refreshUI();
    }
    function missing(){
      for(var i=0;i<chars.length;i++) if(inkLen(data[i]) < MIN_INK) return i;
      return -1;
    }
    function next(){
      if(idx < chars.length - 1){ go(idx + 1); return; }
      var m = missing();
      if(m >= 0) go(m);
      else $('previewBox').scrollIntoView({ behavior:'smooth', block:'center' });
    }

    /* 合併成一張 PNG */
    function toPNG(){
      var parts = [], y0 = Infinity, y1 = -Infinity;
      data.forEach(function(s){
        if(!s.length) return;
        var b = bounds(s); parts.push({ s:s, b:b });
        if(b.y0 < y0) y0 = b.y0; if(b.y1 > y1) y1 = b.y1;
      });
      if(!parts.length) return '';
      var m = LW * 1.5, w = m * 2 + GAP * (parts.length - 1), h = (y1 - y0) + m * 2;
      parts.forEach(function(p){ w += p.b.x1 - p.b.x0; });
      var k = Math.min(OUT_H / h, OUT_W / w), url;
      for(var tries=0; tries<6; tries++){
        var out = document.createElement('canvas');
        out.width = Math.max(1, Math.round(w * k)); out.height = Math.max(1, Math.round(h * k));
        var c = out.getContext('2d'), x = m;
        parts.forEach(function(p){ drawAll(c, p.s, k, p.b.x0 - x, y0 - m); x += (p.b.x1 - p.b.x0) + GAP; });
        url = out.toDataURL('image/png');
        if(url.length < 45000) break;
        k *= 0.75;
      }
      return url;
    }

    return {
      setChars: function(list){
        chars = list.length ? list : ['簽'];
        data = chars.map(function(){ return []; });
        idx = 0; cur = null;
        buildSlots(); resize(); redraw(); changed();
      },
      resize: resize,
      prev: function(){ go(idx - 1); },
      next: next,
      go: go,
      undo: function(){ data[idx].pop(); redraw(); changed(); },
      clear: function(){ data[idx] = []; cur = null; redraw(); changed(); },
      allFilled: function(){ return chars.length > 0 && data.every(function(s){ return s.length > 0; }); },
      missing: missing,
      charAt: function(i){ return chars[i]; },
      toPNG: toPNG
    };
  })();

  function onChange(){ $('btnSubmit').disabled = !pad.allFilled() || !$('ack').checked; $('signMsg').textContent=''; }
  $('ack').addEventListener('change', onChange);
  $('btnPrev').addEventListener('click', function(){ pad.prev(); });
  $('btnNext').addEventListener('click', function(){ pad.next(); });
  $('btnUndo').addEventListener('click', function(){ pad.undo(); });
  $('btnClear').addEventListener('click', function(){ pad.clear(); });

  /* ---------- 流程 ---------- */
  function renderSign(res){
    state.person = res.person; state.period = res.period;
    setHeader(res.period);
    $('whoName').textContent = res.person.name;
    $('whoDept').textContent = res.person.dept + '　代號 ' + res.person.code;
    $('mDept').textContent = res.period.dept;
    $('mPresenter').textContent = res.period.presenter;
    renderContent($('content'), res.period.content);
    var st = $('status'); st.innerHTML = '';
    if(res.signed){
      st.className = 'status ok';
      st.appendChild(document.createTextNode('您已於 ' + res.signed.time + ' 完成本期簽名。如需重簽，請在下方重新簽名後送出。'));
      var img = document.createElement('img'); img.src = res.signed.img; st.appendChild(img);
      $('padTitle').textContent = '重新簽名（會覆蓋原簽名）';
      $('contentBox').open = false;
    }else{
      st.className = 'status todo';
      st.textContent = '本期（' + res.period.id + '）尚未簽名，請閱讀宣導事項後簽名。';
      $('padTitle').textContent = '請逐字簽名';
      $('contentBox').open = true;
    }
    $('ack').checked = false;
    pad.setChars(Array.from(String(res.person.name || '').replace(/\s+/g, '')));   // 「陳  擎」→ 陳、擎
    show('vSign');
  }

  function doLogin(code){
    $('loginMsg').textContent = '';
    $('btnLogin').disabled = true; $('btnLogin').textContent = '登入中…';
    return call('apiLogin', code).then(function(res){
      if(!res.ok){ store(STORE_KEY, null); show('vLogin'); $('loginMsg').textContent = res.msg; return; }
      store(STORE_KEY, res.person.code);
      renderSign(res);
    }).catch(function(err){ show('vLogin'); $('loginMsg').textContent = '連線失敗：' + err; })
      .then(function(){ $('btnLogin').disabled = false; $('btnLogin').textContent = '登入'; });
  }

  var adminMode = false;
  function setAdminMode(on){
    adminMode = on;
    $('vLogin').classList.toggle('admin', on);
    document.querySelector('label[for=code]').textContent = on ? '請輸入管理者姓名代號' : '請輸入您的姓名代號';
    $('btnLogin').textContent = on ? '管理者登入' : '登入';
    $('btnAdminMode').textContent = on ? '← 返回一般簽名登入' : '🔑 管理者登入';
    $('loginMsg').textContent = ''; $('code').value = ''; $('code').focus();
  }
  $('btnAdminMode').addEventListener('click', function(){ setAdminMode(!adminMode); });

  function adminUrl(){
    if(GH) return new URL('board.html?page=admin', location.href).href;
    return state.appUrl ? state.appUrl + '?page=admin' : '';
  }
  function doAdminLogin(code){
    var btn = $('btnLogin'); btn.disabled = true; btn.textContent = '驗證中…';
    var urlP = (GH || state.appUrl) ? Promise.resolve() : call('apiAppUrl').then(function(u){ state.appUrl = u; });
    Promise.all([call('apiAdminLogin', code), urlP]).then(function(r){
      var res = r[0];
      if(!res.ok){ $('loginMsg').textContent = res.msg; return; }
      try{ sessionStorage.setItem('signapp_pw', code); }catch(e){}
      var url = adminUrl();
      $('loginMsg').className = 'msg ok';
      $('loginMsg').innerHTML = '';
      $('loginMsg').appendChild(document.createTextNode((res.name ? res.name + ' 您好，' : '') + '正在前往管理頁… '));
      var a = document.createElement('a'); a.href = url; a.target = '_top'; a.textContent = '（沒有自動跳轉請點這裡）';
      $('loginMsg').appendChild(a);
      window.open(url, '_top');
    }).catch(function(err){ $('loginMsg').textContent = '連線失敗：' + err; })
      .then(function(){ btn.disabled = false; btn.textContent = adminMode ? '管理者登入' : '登入'; });
  }

  $('btnLogin').addEventListener('click', function(){
    var c = $('code').value.replace(/\D/g,'');
    $('loginMsg').className = 'msg err';
    if(!c){ $('loginMsg').textContent = adminMode ? '請輸入管理者姓名代號' : '請輸入姓名代號'; return; }
    if(adminMode) doAdminLogin(c); else doLogin(c);
  });
  $('code').addEventListener('keydown', function(e){ if(e.key === 'Enter') $('btnLogin').click(); });
  $('btnSwitch').addEventListener('click', function(){
    store(STORE_KEY, null); state.person = null; $('code').value = ''; show('vLogin'); $('code').focus();
  });

  $('btnSubmit').addEventListener('click', function(){
    var miss = pad.missing();
    if(miss >= 0){
      pad.go(miss);
      $('signMsg').className = 'msg err';
      $('signMsg').textContent = '第 ' + (miss + 1) + ' 字「' + pad.charAt(miss) + '」簽名太短，請完整書寫';
      $('padWrap').scrollIntoView({ behavior:'smooth', block:'center' });
      return;
    }
    var btn = $('btnSubmit'); btn.disabled = true; btn.textContent = '送出中…';
    var url = pad.toPNG();
    call('apiSubmit', state.person.code, state.period.id, url).then(function(res){
      if(!res.ok){ $('signMsg').className='msg err'; $('signMsg').textContent = res.msg; return; }
      $('doneText').textContent = res.name + '｜' + state.period.id + '｜' + res.time;
      $('doneImg').src = url;
      show('vDone');
    }).catch(function(err){
      $('signMsg').className='msg err'; $('signMsg').textContent = '送出失敗：' + err + '（請再試一次）';
    }).then(function(){ btn.textContent = '送出簽名'; onChange(); });
  });

  $('btnBack').addEventListener('click', function(){ doLogin(state.person.code); });

  /* ---------- 啟動 ---------- */
  if(GH){ $('boardLink').href = 'board.html'; $('boardLink').hidden = false; }
  else call('apiAppUrl').then(function(u){ state.appUrl = u; if(u){ $('boardLink').href = u + '?page=view'; $('boardLink').hidden = false; } }).catch(function(){});
  var saved = load(STORE_KEY);
  call('apiGetActive').then(function(p){
    setHeader(p);
    if(saved){ $('code').value = saved; return doLogin(saved); }
    show('vLogin');
  }).catch(function(err){ show('vLogin'); $('loginMsg').textContent = '連線失敗：' + err; });
})();
</script>
</body>
</html>
